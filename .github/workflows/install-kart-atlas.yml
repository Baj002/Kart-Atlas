name: Install Kart Atlas source
on:
  push:
    paths:
      - 'bootstrap/payload.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract prepared Kart Atlas project
        run: |
          base64 --decode bootstrap/payload.b64 > /tmp/kart-atlas.tar.xz
          tar -xJf /tmp/kart-atlas.tar.xz
          python3 scripts/build_site.py
          python3 -m unittest discover -s tests -v
          rm -rf bootstrap
      - name: Commit project files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install Kart Atlas website and automated schedule monitor' || exit 0
          git push
