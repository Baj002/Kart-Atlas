name: Refresh North American kart calendar
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'data/monitor_sources.json', 'data/discovery_sources.json', 'data/races.csv', 'data/clubs.json', 'data/regions.json', '.github/workflows/**']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'data/**', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: kart-atlas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate app JavaScript
        run: |
          node --check site/app.js
          node --check site/coverage.js
          node --check site/sw.js
      - name: Validate generated site data
        run: python -m scripts.validate_data
  refresh:
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover organizer events, calendars and new clubs
        run: python -m scripts.discover_events
      - name: Regenerate site datasets and coverage
        run: |
          python -m scripts.build_site
          python -m scripts.coverage_report
          python -m scripts.validate_data
      - name: Archive discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-report
          path: reports/
      - name: Commit validated updates
        run: |
          git config user.name 'kart-atlas-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source_state.json data/automated_events.json data/discovered_sources.json reports/discovery.json reports/coverage.json site/events.json site/clubs.json site/coverage.json site/monitor_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh kart races and discovery coverage'
            git push
          fi
      - name: Require at least one successful trusted source
        run: python -m scripts.validate_data --live
